<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moda Shop Tarragona</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; color:#fff; font-family: Arial, Helvetica, sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:20px; border-bottom:2px solid #fff; position:sticky; top:0; background:#000; z-index:100; }
  header h1 { font-size:22px; letter-spacing:2px; text-transform:uppercase; }
  .menu-btn { background:#fff; color:#000; border:none; padding:10px 16px; font-weight:bold; cursor:pointer; }
  nav { display:none; flex-direction:column; background:#111; border-bottom:2px solid #fff; }
  nav.open { display:flex; }
  nav a { color:#fff; text-decoration:none; padding:15px 20px; border-bottom:1px solid #333; text-transform:uppercase; letter-spacing:1px; }
  nav a:hover { background:#fff; color:#000; }
  section { padding:40px 20px; border-bottom:1px solid #333; }
  section h2 { text-transform:uppercase; letter-spacing:2px; margin-bottom:20px; border-left:4px solid #fff; padding-left:10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; }
  .card { background:#111; border:1px solid #333; padding:15px; }
  .card img { width:100%; height:220px; object-fit:cover; margin-bottom:10px; filter:grayscale(100%); }
  .card h3 { font-size:16px; text-transform:uppercase; margin-bottom:8px; }
  .card p.desc { font-size:13px; color:#ccc; margin-bottom:8px; }
  .card .precio { font-size:18px; font-weight:bold; margin-bottom:6px; }
  .stock { display:inline-block; font-size:12px; padding:3px 8px; margin-bottom:10px; text-transform:uppercase; }
  .stock.si { background:#fff; color:#000; }
  .stock.no { background:#333; color:#999; }
  .whatsapp { display:block; text-align:center; background:#fff; color:#000; text-decoration:none; padding:10px; font-weight:bold; text-transform:uppercase; }
  .whatsapp:hover { background:#ccc; }
  footer { text-align:center; padding:20px; font-size:12px; color:#777; }
</style>
</head>
<body>

<header>
  <h1>Moda Shop Tarragona</h1>
  <button class="menu-btn" onclick="document.getElementById('menu').classList.toggle('open')">MENÚ ☰</button>
</header>

<nav id="menu">
  <a href="#ofertas">Ofertas</a>
  <a href="#camisetas">Camisetas</a>
  <a href="#shorts">Shorts</a>
  <a href="#pantalones">Pantalones</a>
  <a href="#chaquetas">Chaquetas</a>
  <a href="#zapatillas">Zapatillas</a>
  <a href="#accesorios">Accesorios</a>
  <a href="#relojes">Relojes</a>
</nav>

<section id="ofertas">
  <h2>Ofertas</h2>
  <div class="grid">
    <!-- Copia esta tarjeta por cada producto en oferta -->
    <div class="card">
      <img src="URL_DE_LA_IMAGEN" alt="Nombre del producto">
      <h3>Título del producto</h3>
      <p class="desc">Descripción del producto.</p>
      <span class="stock si">En stock</span>
      <p class="precio">19,99 €</p>
      <a class="whatsapp" href="https://wa.me/34XXXXXXXXX?text=Hola,%20me%20interesa%20este%20producto" target="_blank">Comprar por WhatsApp</a>
    </div>
  </div>
</section>

<section id="camisetas">
  <h2>Camisetas</h2>
  <div class="grid">
    <!-- Añade aquí tus tarjetas de camisetas -->
  </div>
</section>

<section id="shorts">
  <h2>Shorts</h2>
  <div class="grid"></div>
</section>

<section id="pantalones">
  <h2>Pantalones</h2>
  <div class="grid"></div>
</section>

<section id="chaquetas">
  <h2>Chaquetas</h2>
  <div class="grid"></div>
</section>

<section id="zapatillas">
  <h2>Zapatillas</h2>
  <div class="grid"></div>
</section>

<section id="accesorios">
  <h2>Accesorios</h2>
  <div class="grid"></div>
</section>

<section id="relojes">
  <h2>Relojes</h2>
  <div class="grid"></div>
</section>

<footer>
  © Moda Shop Tarragona
</footer>

</body>
</html>
